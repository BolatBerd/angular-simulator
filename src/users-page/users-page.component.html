<section class="users-page">

  <div class="form-section">
    <app-create-user
      [existingUsers]="users"
      (createUser)="onCreateUser($event)"
    ></app-create-user>
  </div>

  <div class="controls">
    <button id="refresh-btn" class="refresh-btn" (click)="refreshUsers()" title="Загрузить данные с сервера">
      <img class="bg" src="/images/bg-button-refresh-users.png" alt="">
      <img class="icon" src="/images/button-refresh-users-icons.svg" alt="">
    </button>

    <button id="clear-btn" class="clear-btn" (click)="clearAllUsers()" title="Очистить всех пользователей">
      <img class="bg" src="/images/bg-button-clear-users.png" alt="">
      <img class="icon" src="/images/button-clear-users-icons.svg" alt="">
      Очистить всех пользователей
    </button>
  </div>

  <div class="filter-section">
    <input
      id="filter-input"
      type="text"
      [(ngModel)]="filterQuery"
      placeholder="🔍 Поиск по имени..."
      class="filter-input"
    />
    @if (filterQuery) {
      <span class="filter-info">Найдено: {{ filteredUsers.length }}</span>
    }
  </div>

  <div class="cards-section">
    @for (user of filteredUsers; track user.id) {
      <app-user-card
        [user]="user"
        (deleteUser)="onDeleteUser($event)"
      ></app-user-card>
    } @empty {
      <div class="empty-state">
        @if (filterQuery) {
          <p>😔 Пользователей с именем "{{ filterQuery }}" не найдено</p>
        } @else {
          <p>📭 Нет пользователей для отображения</p>
        }
      </div>
    }
  </div>
</section>
