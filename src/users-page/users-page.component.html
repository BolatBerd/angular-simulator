
<section class="users-page">

  <div class="form-section">
    <app-create-user
      [onExistingUsers]="users"

      (onCreateUser)="onCreateUser($event)"
    ></app-create-user>
  </div>

  <div class="controls">
    <button id="refresh-btn" class="refresh-btn" (click)="refreshUsers()" title="Загрузить данные с сервера">
      <img class="icon" src="/images/refresh-users-icon.svg" alt="">
    </button>
  </div>
  <app-users-filter (onFilterUsers)="onFilterUser($event)"> </app-users-filter>

  <div class="cards-section">
      @for (user of filteredUsers$ | async; track user.id) {
        <app-user-card
          [user]="user"
          (onDeleteUser)="onDeleteUser($event)"
        ></app-user-card>
      } @empty {
      <div class="empty-state">
          <p>📭 Нет пользователей для отображения</p>
      </div>
      }
  </div>

</section>
