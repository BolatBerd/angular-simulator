@let user = authService.authUser$ | async;

@if (user) {
  <div class="layout">
    <app-header></app-header>
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
    <app-footer></app-footer>
  </div>
} @else {
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
}

<app-loader></app-loader>
<app-message></app-message>
