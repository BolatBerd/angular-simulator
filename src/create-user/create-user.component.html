<form class="create-user-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <fieldset class="form-section">
    <legend class="form-section__legend">Основная информация</legend>

    <div class="form-field">
      <label class="form-field__label" for="name">Имя</label>
      <input id="name" type="text" formControlName="name" class="form-field__input" />
    </div>

    <div class="form-field">
      <label class="form-field__label" for="user-name">Имя пользователя</label>
      <input id="user-name" type="text" formControlName="username" class="form-field__input" />
    </div>
  </fieldset>

  <fieldset class="form-section">
    <legend class="form-section__legend">Контакты</legend>

    <div class="form-field">
      <label class="form-field__label" for="email">Почта</label>
      <input id="email" type="text" formControlName="email" class="form-field__input" />
    </div>

    <div class="form-field">
      <label class="form-field__label" for="phone">Телефон</label>
      <input id="phone" type="text" formControlName="phone" class="form-field__input" />
    </div>

    <div class="form-field">
      <label class="form-field__label" for="website">Сайт</label>
      <input id="website" type="text" formControlName="website" class="form-field__input" />
    </div>
  </fieldset>

  <fieldset class="form-section" formGroupName="address">
    <legend class="form-section__legend">Адрес</legend>

    <div class="form-field">
      <label class="form-field__label" for="address-city">Город</label>
      <input id="address-city" type="text" formControlName="city" class="form-field__input" />
    </div>

    <div class="form-field">
      <label class="form-field__label" for="address-street">Улица</label>
      <input id="address-street" type="text" formControlName="street" class="form-field__input" />
    </div>

    <div class="form-field">
      <label class="form-field__label" for="address-suite">Офис</label>
      <input id="address-suite" type="text" formControlName="suite" class="form-field__input" />
    </div>

    <div class="form-field">
      <label class="form-field__label" for="address-zipcode">Индекс</label>
      <input id="address-zipcode" type="text" formControlName="zipcode" class="form-field__input" />
    </div>

    <fieldset class="form-section form-section--inner" formGroupName="geo">
      <legend class="form-section__legend">Координаты</legend>

      <div class="form-field">
        <label class="form-field__label" for="geo-lat">Широта</label>
        <input id="geo-lat" type="text" formControlName="lat" class="form-field__input" />
      </div>

      <div class="form-field">
        <label class="form-field__label" for="geo-lng">Долгота</label>
        <input id="geo-lng" type="text" formControlName="lng" class="form-field__input" />
      </div>
    </fieldset>
  </fieldset>

  <fieldset class="form-section" formGroupName="company">
    <legend class="form-section__legend">Компания</legend>

    <div class="form-field">
      <label class="form-field__label" for="company-name">Название компании</label>
      <input id="company-name" type="text" formControlName="name" class="form-field__input" />
    </div>

    <div class="form-field">
      <label class="form-field__label" for="company-catchPhrase">Слоган</label>
      <input id="company-catchPhrase" type="text" formControlName="catchPhrase" class="form-field__input" />
    </div>

    <div class="form-field">
      <label class="form-field__label" for="company-bs">BS</label>
      <input id="company-bs" type="text" formControlName="bs" class="form-field__input" />
    </div>
  </fieldset>

  <button id="create-user-submit" type="submit" class="form-submit" [disabled]="form.invalid">
    Создать пользователя
  </button>

</form>

<button id="refresh-btn" class="refresh-btn" (click)="reload()">
  <img class="bg" src="/images/bg-button-refresh-users.png" alt="">
  <img class="icon" src="/images/button-refresh-users-icons.svg" alt="">
</button>
