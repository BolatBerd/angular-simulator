<form class="create-user-form" [formGroup]="form">
  <fieldset class="form-section">
    <legend class="form-section__legend">{{ 'CREATE_USER.SECTION_MAIN' | translate }}</legend>

    <div class="form-field">
      <label class="form-field__label" for="name">{{ 'CREATE_USER.NAME' | translate }}</label>
      <input
        hoverBorder
        [gradientConfiguration]="hoverConfig"
        id="name"
        type="text"
        formControlName="name"
        class="form-field__input"
      />
    </div>

    <div class="form-field">
      <label class="form-field__label" for="user-name">{{ 'CREATE_USER.USERNAME' | translate }}</label>
      <input
        hoverBorder
        [gradientConfiguration]="hoverConfig"
        id="user-name"
        type="text"
        formControlName="username"
        class="form-field__input"
      />
    </div>
  </fieldset>

  <fieldset class="form-section">
    <legend class="form-section__legend">{{ 'CREATE_USER.SECTION_CONTACTS' | translate }}</legend>

    <div class="form-field">
      <label class="form-field__label" for="email">{{ 'CREATE_USER.EMAIL' | translate }}</label>
      <input
        hoverBorder
        [gradientConfiguration]="hoverConfig"
        id="email"
        type="text"
        formControlName="email"
        class="form-field__input"
      />
    </div>

    <div class="form-field">
      <label class="form-field__label" for="phone">{{ 'CREATE_USER.PHONE' | translate }}</label>
      <input
        hoverBorder
        [gradientConfiguration]="hoverConfig"
        id="phone"
        type="text"
        formControlName="phone"
        class="form-field__input"
      />
    </div>

    <div class="form-field">
      <label class="form-field__label" for="website">{{ 'CREATE_USER.WEBSITE' | translate }}</label>
      <input
        hoverBorder
        [gradientConfiguration]="hoverConfig"
        id="website"
        type="text"
        formControlName="website"
        value="{{ 'CREATE_USER.UNKNOWN' | translate }}"
        class="form-field__input"
      />
    </div>
  </fieldset>

  <fieldset class="form-section" formGroupName="address">
    <legend class="form-section__legend">{{ 'CREATE_USER.SECTION_ADDRESS' | translate }}</legend>

    <div class="form-field">
      <label class="form-field__label" for="address-city">{{ 'CREATE_USER.CITY' | translate }}</label>
      <input
        hoverBorder
        [gradientConfiguration]="hoverConfig"
        id="address-city"
        type="text"
        formControlName="city"
        class="form-field__input"
      />
    </div>

    <div class="form-field">
      <label class="form-field__label" for="address-street">{{ 'CREATE_USER.STREET' | translate }}</label>
      <input
        hoverBorder
        [gradientConfiguration]="hoverConfig"
        id="address-street"
        type="text"
        formControlName="street"
        class="form-field__input"
      />
    </div>

    <div class="form-field">
      <label class="form-field__label" for="address-suite">{{ 'CREATE_USER.SUITE' | translate }}</label>
      <input
        hoverBorder
        [gradientConfiguration]="hoverConfig"
        id="address-suite"
        type="text"
        formControlName="suite"
        value="{{ 'CREATE_USER.UNKNOWN' | translate }}"
        class="form-field__input"
      />
    </div>

    <div class="form-field">
      <label class="form-field__label" for="address-zipcode">{{ 'CREATE_USER.ZIPCODE' | translate }}</label>
      <input
        hoverBorder
        [gradientConfiguration]="hoverConfig"
        id="address-zipcode"
        type="text"
        formControlName="zipcode"
        class="form-field__input"
      />
    </div>

    <fieldset class="form-section form-section--inner" formGroupName="geo">
      <legend class="form-section__legend">{{ 'CREATE_USER.GEO_TITLE' | translate }}</legend>

      <div class="form-field">
        <label class="form-field__label" for="geo-lat">{{ 'CREATE_USER.LAT' | translate }}</label>
        <input
          hoverBorder
          [gradientConfiguration]="hoverConfig"
          id="geo-lat"
          type="text"
          formControlName="lat"
          class="form-field__input"
        />
      </div>

      <div class="form-field">
        <label class="form-field__label" for="geo-lng">{{ 'CREATE_USER.LNG' | translate }}</label>
        <input
          hoverBorder
          [gradientConfiguration]="hoverConfig"
          id="geo-lng"
          type="text"
          formControlName="lng"
          class="form-field__input"
        />
      </div>
    </fieldset>
  </fieldset>

  <fieldset class="form-section" formGroupName="company">
    <legend class="form-section__legend">{{ 'CREATE_USER.SECTION_COMPANY' | translate }}</legend>

    <div class="form-field">
      <label class="form-field__label" for="company-name">{{ 'CREATE_USER.COMPANY_NAME' | translate }}</label>
      <input
        hoverBorder
        [gradientConfiguration]="hoverConfig"
        id="company-name"
        type="text"
        formControlName="name"
        class="form-field__input"
      />
    </div>

    <div class="form-field">
      <label class="form-field__label" for="company-catchPhrase">{{ 'CREATE_USER.COMPANY_SLOGAN' | translate }}</label>
      <input
        hoverBorder
        [gradientConfiguration]="hoverConfig"
        id="company-catchPhrase"
        type="text"
        formControlName="catchPhrase"
        value="{{ 'CREATE_USER.UNKNOWN' | translate }}"
        class="form-field__input"
      />
    </div>

    <div class="form-field">
      <label class="form-field__label" for="company-bs">{{ 'CREATE_USER.COMPANY_BS' | translate }}</label>
      <input
        hoverBorder
        [gradientConfiguration]="hoverConfig"
        id="company-bs"
        type="text"
        formControlName="bs"
        value="{{ 'CREATE_USER.UNKNOWN' | translate }}"
        class="form-field__input"
      />
    </div>
  </fieldset>
</form>

<button
  hover
  id="create-user-submit"
  type="button"
  (click)="onSubmit()"
  class="form-submit"
  [disabled]="form.invalid"
>
  {{ 'CREATE_USER.CREATE_BUTTON' | translate }}
</button>
