<form [formGroup]="editForm" (ngSubmit)="onSave()">
  <div class="flex flex-column gap-3" style="max-width: 400px;">

    <div class="flex flex-column gap-2">
      <label for="title">Title:</label>
      <input
        pInputText
        id="title"
        formControlName="title"
        placeholder="Enter post title"
      />
      @if (editForm.get('title')?.invalid && editForm.get('title')?.touched) {
        <small class="text-red-500">Title is required (min 3 characters).</small>
      }
    </div>

    <div class="flex flex-column gap-2">
      <label for="tags">Tags (comma-separated):</label>
      <textarea
        pInputTextarea
        id="tags"
        formControlName="tags"
        rows="3"
        placeholder="e.g. angular, typescript, web"
      ></textarea>
    </div>

    <div class="flex flex-column gap-2">
      <label for="views">Views:</label>
      <input
        type="number"
        pInputNumber
        id="views"
        formControlName="views"
        placeholder="0"
      />
    </div>

    <div class="flex justify-content-end gap-2 mt-3">
      <button
        pButton
        type="button"
        label="Выход"
        severity="secondary"
        (click)="onCancel()"
      ></button>
      <button
        pButton
        type="submit"
        label="Сохранить"
        [disabled]="editForm.invalid"
      ></button>
    </div>

  </div>
</form>
