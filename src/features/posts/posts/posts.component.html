@if(isLoading$ | async){
  <p-table [value]="posts" [tableStyle]="{ 'min-width': '50rem' }">
      <ng-template #header>
          <tr>
              <th>Title</th>
              <th>Tags</th>
              <th>Views</th>
          </tr>
      </ng-template>
      <ng-template #body let-post>
          <tr>
              <td><p-skeleton width="10%" height="1.5em"/></td>
              <td><p-skeleton width="10%" height="1.5em"/></td>
              <td><p-skeleton width="10%" height="1.5em"/></td>
          </tr>
      </ng-template>
  </p-table>
} @else {
    <p-contextMenu #cm [model]="menuItems" />
    <p-table [value]="posts">
    <ng-template pTemplate="header">
      <tr>
        <th>Title</th>
        <th>Tags</th>
        <th>Views</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-post>
      <tr
        (dblclick)="onRowDblClick(post)"
        (contextmenu)="selectedPost = post;
        $event.preventDefault();
        cm.show($event)"
      >
        <td>{{ post.title }}</td>
        <td>{{ post.tags.join(', ') }}</td>
        <td>{{ post.views }}</td>
      </tr>
    </ng-template>
  </p-table>
}
<button (click)="onCreatePost()" pButton type="button" label="Создать пост"></button>
<p-paginator
  style="margin-bottom: 150px;"
  [rows]="pageSize"
  [totalRecords]="totalPosts"
  (onPageChange)="onPageChange($event)"
  [rowsPerPageOptions]="[10, 20, 30]"
  >
</p-paginator>
